<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="tata-face-glow" cx="100" cy="100" r="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffedd5" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#ffedd5" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffedd5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tata-bolt" x1="0" y1="48" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.75" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <!-- Keeps the ground and power lines inside the patch face -->
    <clipPath id="tata-face-clip">
      <circle cx="100" cy="100" r="84"/>
    </clipPath>
  </defs>

  <!-- Patch face -->
  <circle cx="100" cy="100" r="90" fill="#0b1020"/>
  <circle cx="100" cy="100" r="82" fill="url(#tata-face-glow)"/>

  <g clip-path="url(#tata-face-clip)">
  <!-- Ground -->
  <path d="M14 152 Q100 126 186 152 L186 190 L14 190 Z" fill="#ffedd5" fill-opacity="0.08"/>
  <path d="M14 152 Q100 128 186 152" fill="none" stroke="#ffedd5" stroke-width="5" stroke-linecap="round"/>

  <!-- Power lines -->
  <g fill="none" stroke="#ffedd5" stroke-width="3.5" stroke-linecap="round">
    <path d="M78 96 Q100 113 122 96"/>
    <path d="M72 108 Q100 125 128 108"/>
    <path d="M38 96 Q28 103 14 104"/>
    <path d="M162 96 Q172 103 186 104"/>
  </g>

  <!-- Left pylon -->
  <g fill="none" stroke="#ffedd5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 142 L54 96 L58 82 L62 96 L72 142"/>
    <path d="M38 96 L78 96"/>
    <path d="M44 108 L72 108"/>
    <path d="M49 118 L67 118"/>
    <path d="M45 140 L67 118 M71 140 L49 118"/>
    <path d="M49 118 L62 100 M67 118 L54 100"/>
  </g>

  <!-- Right pylon -->
  <g transform="translate(84 0)" fill="none" stroke="#ffedd5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 142 L54 96 L58 82 L62 96 L72 142"/>
    <path d="M38 96 L78 96"/>
    <path d="M44 108 L72 108"/>
    <path d="M49 118 L67 118"/>
    <path d="M45 140 L67 118 M71 140 L49 118"/>
    <path d="M49 118 L62 100 M67 118 L54 100"/>
  </g>

  <!-- Lightning bolt -->
  <path d="M108 48 L82 104 L98 104 L88 160 L122 90 L104 90 L116 48 Z" fill="url(#tata-bolt)" stroke="#0b1020" stroke-width="3" stroke-linejoin="round"/>
  <path d="M109 56 L91 98 L97 98 Z" fill="#ffedd5"/>
  <path d="M104 94 L113 94 L97 136 Z" fill="#ffedd5" fill-opacity="0.85"/>

  <!-- Three stars -->
  <path d="M64 46 L66.4 51.6 L72 54 L66.4 56.4 L64 62 L61.6 56.4 L56 54 L61.6 51.6 Z" fill="#ffedd5"/>
  <path d="M100 22 L103 29 L110 32 L103 35 L100 42 L97 35 L90 32 L97 29 Z" fill="#fbbf24"/>
  <path d="M136 46 L138.4 51.6 L144 54 L138.4 56.4 L136 62 L133.6 56.4 L128 54 L133.6 51.6 Z" fill="#ffedd5"/>

  </g>

  <!-- Border ring with satin stitching -->
  <circle cx="100" cy="100" r="89" fill="none" stroke="#fb923c" stroke-width="16"/>
  <circle cx="100" cy="100" r="81.5" fill="none" stroke="#0b1020" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="100" cy="100" r="89" fill="none" stroke="#ffedd5" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/>
</svg>
