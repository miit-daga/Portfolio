<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="akatsuki-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.38" stop-color="#1c1a36"/>
      <stop offset="0.58" stop-color="#6b3a3f"/>
      <stop offset="0.70" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="akatsuki-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffedd5"/>
      <stop offset="0.45" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </radialGradient>
    <radialGradient id="akatsuki-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="akatsuki-face-clip">
      <circle cx="100" cy="100" r="82"/>
    </clipPath>
  </defs>

  <!-- Outer satin border -->
  <circle cx="100" cy="100" r="97" fill="#fb923c"/>
  <circle cx="100" cy="100" r="89.5" fill="none" stroke="#ffedd5" stroke-width="2.5" stroke-dasharray="5 3.5" stroke-linecap="round"/>

  <!-- Patch face -->
  <g clip-path="url(#akatsuki-face-clip)">
    <circle cx="100" cy="100" r="82" fill="url(#akatsuki-sky)"/>

    <!-- Sun glow -->
    <circle cx="100" cy="132" r="62" fill="url(#akatsuki-halo)"/>

    <!-- Rays -->
    <g stroke="#fbbf24" stroke-width="6" stroke-linecap="round">
      <line x1="135.7" y1="119.0" x2="150.8" y2="113.5"/>
      <line x1="126.9" y1="105.1" x2="138.2" y2="93.8"/>
      <line x1="114.5" y1="96.9" x2="120.7" y2="82.1"/>
      <line x1="100" y1="94" x2="100" y2="76"/>
      <line x1="85.5" y1="96.9" x2="79.3" y2="82.1"/>
      <line x1="73.1" y1="105.1" x2="61.8" y2="93.8"/>
      <line x1="64.3" y1="119.0" x2="49.2" y2="113.5"/>
    </g>

    <!-- Sun -->
    <circle cx="100" cy="132" r="30" fill="url(#akatsuki-sun)"/>

    <!-- Planet with glowing rim -->
    <circle cx="100" cy="292" r="162" fill="none" stroke="#fb923c" stroke-width="14" stroke-opacity="0.35"/>
    <circle cx="100" cy="292" r="162" fill="#0b1020" stroke="#fb923c" stroke-width="5"/>

    <!-- Three stars: the team -->
    <g fill="#ffedd5">
      <path transform="translate(100 38)" d="M0 -11 L3 -3 L11 0 L3 3 L0 11 L-3 3 L-11 0 L-3 -3 Z"/>
      <path transform="translate(63 60)" d="M0 -9 L2.6 -2.6 L9 0 L2.6 2.6 L0 9 L-2.6 2.6 L-9 0 L-2.6 -2.6 Z"/>
      <path transform="translate(139 56)" d="M0 -8 L2.4 -2.4 L8 0 L2.4 2.4 L0 8 L-2.4 2.4 L-8 0 L-2.4 -2.4 Z"/>
    </g>
  </g>

  <!-- Seam between face and border -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#0b1020" stroke-width="2"/>
</svg>
