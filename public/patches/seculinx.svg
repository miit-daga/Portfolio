<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="seculinx-face" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#1e2848"/>
      <stop offset="60%" stop-color="#121931"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </radialGradient>
    <radialGradient id="seculinx-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="seculinx-window" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </radialGradient>
  </defs>

  <!-- Outer satin-stitched border -->
  <circle cx="100" cy="100" r="97" fill="#fb923c"/>
  <circle cx="100" cy="100" r="89.5" fill="none" stroke="#ffedd5" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>

  <!-- Patch face -->
  <circle cx="100" cy="100" r="82" fill="url(#seculinx-face)" stroke="#0b1020" stroke-width="2"/>

  <!-- Stars -->
  <path d="M34 80 L37 87 L44 90 L37 93 L34 100 L31 93 L24 90 L31 87 Z" fill="#ffedd5"/>
  <path d="M166 80 L169 87 L176 90 L169 93 L166 100 L163 93 L156 90 L163 87 Z" fill="#ffedd5"/>

  <!-- Heater shield -->
  <path d="M56 58 L144 58 L144 104 Q144 146 100 168 Q56 146 56 104 Z" fill="#fb923c" fill-opacity="0.18" stroke="#fbbf24" stroke-width="5" stroke-linejoin="round"/>

  <!-- Wireless signal arcs -->
  <path d="M92.9 90.9 A10 10 0 0 1 107.1 90.9" fill="none" stroke="#fbbf24" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M86.6 84.6 A19 19 0 0 1 113.4 84.6" fill="none" stroke="#fbbf24" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M80.2 78.2 A28 28 0 0 1 119.8 78.2" fill="none" stroke="#fbbf24" stroke-width="5.5" stroke-linecap="round"/>

  <!-- House -->
  <path d="M70 123 L100 100 L130 123 L121 123 L121 150 L79 150 L79 123 Z" fill="#ffedd5" stroke="#ffedd5" stroke-width="2" stroke-linejoin="round"/>
  <rect x="86" y="130" width="12" height="20" rx="1.5" fill="#0b1020"/>

  <!-- Window glow -->
  <circle cx="109.5" cy="133.5" r="13" fill="url(#seculinx-glow)"/>
  <rect x="104" y="128" width="11" height="11" rx="1.5" fill="url(#seculinx-window)" stroke="#0b1020" stroke-width="1.5"/>
</svg>
