        async function runCommand(command) {
            command = command.trim();
            if (isTyping) return;
            isTyping = true;

            if (command) {
                commandHistory.push(command);
                if (commandHistory.length > 100) commandHistory.shift();
                historyIndex = commandHistory.length;
                try { localStorage.setItem('term-history', JSON.stringify(commandHistory)); } catch (e) {}
            }

            addInputLine(command);
            inputLine.value = '';
            ghostInput.value = '';
            inputLine.disabled = true;
            setPromptVisible(false);

            try {
                // Chain first (shell precedence), expand the alias on each
                // segment, then hand off to the existing dispatch untouched.
                const chain = splitChain(command);
                let failed = false;
                for (let i = 0; i < chain.length; i++) {
                    if (chain[i].sep === '&&' && failed) break;
                    const text = expandAlias(chain[i].text);
                    // No command reports a status, so "&&" gates on whether the
                    // next one is a command we actually recognise.
                    failed = !isKnownCommand(text);
                    commandsThisSession++;
                    if (isPipeline(text)) {
                        await runPipeline(text);
                    } else {
                        await executeCommand(text);
                    }
                }
            } finally {
                // Safety net only: every path through executeCommand and
                // runPipeline already calls endTurn(). This guarantees a thrown
                // error can never leave the prompt dead.
                endTurn();
            }
        }

        // The dispatch itself. Split out from runCommand only so a pipeline can
        // run a command as a stage without also re-echoing the prompt line and
        // pushing a second history entry. Each command still ends itself with
        // endTurn(), exactly as before.
        async function executeCommand(command) {
            command = command.trim();
            const cmd = command.toLowerCase();

            // A pipe filter used on its own. Real shells answer this with usage,
            // not "command not found", and ours has the extra job of teaching
            // the syntax to someone who has not seen it yet.
            const bareStage = cmd.split(/\s+/)[0];
            if (PIPE_STAGES.includes(bareStage)) {
                SoundFX.error();
                await typeRaw(`<span class="error-text">${bareStage}: nothing piped in.</span>`);
                const args = bareStage === 'grep' ? ' [-i] [-v] <pattern>'
                    : bareStage === 'wc' ? ' -l'
                    : ' [-n N]';
                await typeRaw(
                    `${bareStage} filters another command's output. ` +
                    `Usage: <span class="highlight-value">${escapeHtml('<command> | ' + bareStage + args)}</span>`
                );
                await typeRaw(
                    `Try <span class="nav-link" onclick="runCommandFromClick('experience | grep aws')">experience | grep aws</span>` +
                    ` or <span class="nav-link" onclick="runCommandFromClick('man ${bareStage}')">man ${bareStage}</span>.`
                );
                endTurn();
                return;
            }

            // leaderboard / submit
            if (cmd === 'leaderboard' || cmd.startsWith('leaderboard ')) {
                await showLeaderboard(command.substring(11));
                endTurn();
                return;
            }
            if (cmd === 'submit' || cmd.startsWith('submit ')) {
                await submitScore(command.substring(6));
                endTurn();
                return;
            }

            // open: frame a page inside the terminal
            if (cmd === 'open' || cmd.startsWith('open ')) {
                await runOpen(command.substring(4));
                endTurn();
                return;
            }

            // scp / telnet
            if (cmd === 'scp' || cmd.startsWith('scp ')) {
                await runScp(command.substring(3));
                endTurn();
                return;
            }
            if (cmd === 'telnet' || cmd.startsWith('telnet ')) {
                await runTelnet(command.substring(6));
                endTurn();
                return;
            }

            // login / logout: the visitor picks the name on the prompt
            if (cmd === 'login' || cmd.startsWith('login ')) {
                await login(command.substring(5));
                endTurn();
                return;
            }
            if (cmd === 'logout') {
                await logout();
                endTurn();
                return;
            }

            // curl: real HTTP, same-origin direct and allowlisted hosts proxied
            if (cmd === 'curl' || cmd.startsWith('curl ')) {
                await runCurl(command.substring(4));
                endTurn();
                return;
            }

            // find: search every section at once
            if (cmd === 'find' || cmd.startsWith('find ')) {
                await findAcross(command.substring(4));
                endTurn();
                return;
            }

            // ping: simulated, nothing leaves the browser
            if (cmd === 'ping' || cmd.startsWith('ping ')) {
                await pingHost(command.substring(4));
                endTurn();
                return;
            }

            // alias / unalias
            if (cmd === 'alias' || cmd.startsWith('alias ')) {
                await manageAlias(command.substring(5).trim());
                endTurn();
                return;
            }
            if (cmd === 'unalias' || cmd.startsWith('unalias ')) {
                await removeAlias(command.substring(7).trim());
                endTurn();
                return;
            }

            // resume --plain prints in the terminal; bare `resume` is untouched
            // below and still opens the PDF.
            if (cmd === 'resume --plain' || cmd === 'resume -p') {
                await plainResume();
                endTurn();
                return;
            }

            // Handle man before the switch (takes an argument)
            if (cmd === 'man' || cmd.startsWith('man ')) {
                await showManual(command.substring(3).trim().toLowerCase());
                endTurn();
                return;
            }

            // Handle ssh before the switch (takes an argument)
            if (cmd === 'ssh' || cmd.startsWith('ssh ')) {
                await runSsh(command.substring(3).trim());
                endTurn();
                return;
            }

            // Handle jettison before the switch (guestbook moderation)
            if (cmd === 'jettison' || cmd.startsWith('jettison ')) {
                await jettison(command.substring(8).trim());
                endTurn();
                return;
            }

            // Handle sign before the switch (takes the rest of the line verbatim)
            if (cmd === 'sign' || cmd.startsWith('sign ')) {
                await signGuestbook(command.substring(4).trim());
                endTurn();
                return;
            }

            // Handle cat commands before the switch
            if (cmd === 'cat' || cmd.startsWith('cat ')) {
                if (cmd === 'cat') {
                    SoundFX.meow();
                    await typeLine("Meow? 🐱", 5);
                } else if (cmd === 'cat secret_plans.txt') {
                    SoundFX.error();
                    await typeLine("Accessing classified file...", 30);
                    await new Promise(r => setTimeout(r, 600));
                    SoundFX.glitch();
                    await typeRaw(`<span class="error-text">Error: Permission denied. You are not authorized to view world domination plans. 😈</span>`);
                    await typeRaw(`<span class="error-text">This incident has been reported to the Council of Cats. 🐱</span>`);
                } else {
                    const filename = command.substring(4).trim();
                    const knownDirs = ['documents', 'downloads', 'music', 'pictures', 'videos'];
                    SoundFX.error();
                    if (knownDirs.includes(filename.toLowerCase())) {
                        const catDirJokes = [
                            `The cat tried to read '${filename}', knocked it off the table, and walked away. 🐱`,
                            `'${filename}' is a folder. The cat is already sitting in it and refuses to move. 📦🐱`,
                            `The cat sniffed '${filename}', judged you silently, and went back to sleep. 😼`,
                            `You can't recite a directory to a cat. Try 'ls ${filename}' if you must snoop. 🐱`,
                            `Error: '${filename}' is a box, not a snack. The cat is disappointed. 🐱`,
                        ];
                        await typeRaw(`<span class="error-text">cat: ${filename}: Is a directory</span>`);
                        await new Promise(r => setTimeout(r, 200));
                        await typeLine(catDirJokes[Math.floor(Math.random() * catDirJokes.length)], 5);
                    } else {
                        await typeRaw(`<span class="error-text">cat: ${filename}: No such file or directory</span>`);
                        await new Promise(r => setTimeout(r, 300));
                        await typeLine("Psst... did you mean 'cat' without args? That one actually meows. 🐱", 5);
                    }
                }
                endTurn();
                return;
            }

            // Handle cd commands before the switch
            if (cmd === 'cd' || cmd.startsWith('cd ')) {
                const target = command.substring(2).trim();
                const dirResponses = {
                    'documents': "📄 Nothing but unfinished to-do lists in there. Trust me.",
                    'downloads': "📦 Just 47 copies of the same file named 'final_FINAL_v3(2).zip'.",

                    outputContainer.innerHTML = '';
                    break;
                case 'mute':
                    SoundFX.isMuted = !SoundFX.isMuted;
                    SoundFX.enter();
                    await typeLine(SoundFX.isMuted ? "Audio feedback disabled." : "Audio feedback enabled.", 10);
                    break;
                case 'home':
                case 'back':
                    SoundFX.powerDown();
                    await typeLine("Closing terminal, back to the portfolio. 🚀", 20);
                    await new Promise(r => setTimeout(r, 900));

                    // Force-close trick (terminal opens in a new tab)
                    window.opener = null;
                    window.open('', '_self');
                    window.close();

                    await typeLine("If the tab didn't close, just switch back to your portfolio tab. ✨", 5);
                    break;
                case 'neofetch': {
                    SoundFX.dataBurst();
                    let themeName = 'teal';
                    try { themeName = localStorage.getItem('term-theme') || 'teal'; } catch (e) {}
                    await typeRaw(
                        `<div style="white-space:pre">` +
                        `<span class="highlight-value">${termUser}</span>@<span class="highlight-value">miit-daga</span>\n` +
                        `-----------------------------\n` +
                        `<span class="highlight-value">OS</span>:       MIIT-DAGA-OS v1.0\n` +
                        `<span class="highlight-value">Host</span>:     Portfolio Terminal\n` +
                        `<span class="highlight-value">Kernel</span>:   cosmic-6.6.6\n` +
                        `<span class="highlight-value">Shell</span>:    miitsh 9.0\n` +
                        `<span class="highlight-value">Role</span>:     Full Stack Engineer\n` +
                        `<span class="highlight-value">Stack</span>:    Node · Next · Postgres · AWS\n` +
                        `<span class="highlight-value">Status</span>:   B.Tech IT graduate\n` +
                        `<span class="highlight-value">Theme</span>:    ${themeName}\n` +
                        `</div>`
                    );
                    break;
                }

                // --- FUN EASTER EGGS ---
                case 'whoami':
                    SoundFX.enter();
                    await typeLine(`${termUser}, but a welcome one. Make yourself at home. 🛋️`, 10);
                    break;
                case 'date':
                    SoundFX.enter();
                    await typeLine(new Date().toString(), 5);
                    break;
                case 'history':
                    SoundFX.enter();
                    if (commandHistory.length <= 1) {
                        await typeLine("No commands in history.", 5);
                    } else {
                        for (let i = 0; i < commandHistory.length - 1; i++) {
                            await typeLine(`  ${i + 1}  ${commandHistory[i]}`, 2);
                        }
                    }
                    break;
                case 'ls':
                    SoundFX.enter();
                    await typeRaw(
                        `<span style="color:var(--term-accent);font-weight:bold">Documents</span>  ` +
                        `<span style="color:var(--term-accent);font-weight:bold">Downloads</span>  ` +
                        `<span style="color:var(--term-accent);font-weight:bold">Music</span>  ` +
                        `<span style="color:var(--term-accent);font-weight:bold">Pictures</span>  ` +
                        `<span style="color:var(--term-accent);font-weight:bold">Videos</span>  ` +
                        `<span style="color:#fff">secret_plans.txt</span>`
                    );
                    break;
                /* ls with args is handled before the switch */
                case 'pwd':
                    SoundFX.enter();
                    await typeLine("/home/miit-daga", 5);
                    break;
                case 'reboot':
                    SoundFX.glitch();
                    await typeLine("System rebooting...", 30);
                    await new Promise(r => setTimeout(r, 1000));
                    location.reload();
                    break;
                case 'exit':
                    SoundFX.powerDown();
                    await typeLine("Logging out...", 20);
                    await new Promise(r => setTimeout(r, 1000)); 
                    
                    // Force Close Trick
                    window.opener = null;
                    window.open('', '_self');
                    window.close();
                    
                    await typeLine("Session terminated. (You can close this tab)", 5);
                    break;

                default:
                    if(command.trim() !== '') {
                        SoundFX.error();
                        await typeRaw(`<span class="error-text">Command not found: ${command}. Type 'help' for a list of available commands.</span>`);
                        const suggestion = closestCommand(cmd);
                        if (suggestion) {
                            await typeRaw(`Did you mean '<span class="nav-link" onclick="runCommandFromClick('${suggestion}')">${suggestion}</span>'?`);
                        }
                    }
            }
            endTurn();
        }

        window.runCommandFromClick = (command) => runCommand(command);

        inputLine.addEventListener('keydown', (e) => {
            // A masked prompt is open: resolve on Enter, cancel on Escape, and
            // swallow history/completion so the hidden value cannot be recalled.
            if (pendingPrompt) {
                if (e.key === 'Enter') { e.preventDefault(); pendingPrompt(inputLine.value); }
                else if (e.key === 'Escape') { e.preventDefault(); pendingPrompt(null); }
                else if (e.key === 'Tab' || e.key.startsWith('Arrow')) { e.preventDefault(); }
                return;
            }

            if (!e.ctrlKey && !e.altKey && !e.metaKey && e.key.length === 1 || e.key === 'Backspace') {
                SoundFX.typing(e.key);
            }

            if (e.key === 'Enter') {
                runCommand(inputLine.value);
            } else if (e.key === 'ArrowRight') {
                if (ghostInput.value && ghostInput.value !== inputLine.value) {
                    e.preventDefault();
                    inputLine.value = ghostInput.value;
                }
            } else if (e.key === 'Tab') {
                e.preventDefault();
                const raw = inputLine.value;
                if (!raw.trim()) return;
                const spaceIdx = raw.indexOf(' ');

                // Decide the candidate pool: arguments after a command, else commands
                let matches, prefixOut;
                if (spaceIdx !== -1) {
                    const cmd = raw.slice(0, spaceIdx);
                    const argPartial = raw.slice(spaceIdx + 1).toLowerCase();
                    const targets = argTargets(cmd);
                    matches = targets.filter(t => t.toLowerCase().startsWith(argPartial));
                    prefixOut = (p) => `${cmd} ${p}`;
                } else {
                    matches = MOCK_DATA.commands.filter(c => c.startsWith(raw.toLowerCase()));
                    prefixOut = (p) => p;
                }

                if (matches.length === 1) {
                    inputLine.value = prefixOut(matches[0]);
                    ghostInput.value = inputLine.value;
                } else if (matches.length > 1) {
                    // Complete to the longest common prefix shared by all matches...
                    let prefix = matches[0];
                    for (const m of matches) {
                        while (!m.toLowerCase().startsWith(prefix.toLowerCase())) prefix = prefix.slice(0, -1);
                    }
                    inputLine.value = prefixOut(prefix);
                    ghostInput.value = '';
                    // ...then list the candidates (bash-style).
                    typeRaw(matches.map(m => `<span class="nav-link" onclick="runCommandFromClick('${prefixOut(m)}')">${m}</span>`).join('  '));
                    terminal.scrollTop = terminal.scrollHeight;
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    inputLine.value = commandHistory[historyIndex];
                    ghostInput.value = inputLine.value;
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    inputLine.value = commandHistory[historyIndex];
                    ghostInput.value = inputLine.value;
                } else {
                    historyIndex = commandHistory.length;
                    inputLine.value = '';
                    ghostInput.value = '';
                }
            } else if (e.ctrlKey && e.key === 'l') {
                e.preventDefault();
                outputContainer.innerHTML = '';
            }
        });
        
        // --- BOOT SEQUENCE LOGIC ---
        // We create a function to initialize the system after interaction
        const startSystem = async () => {
            // Remove the overlay
            overlay.style.display = 'none';

            // Initialize Audio
            SoundFX.init();
            SoundFX.startup(); // Play startup sound

            isTyping = true;
            inputLine.disabled = true;
            setPromptVisible(false);

            const skipBoot = () => { bootSkipped = true; };
            let skipHintEl = null;
            const finishReady = () => {
                document.removeEventListener('keydown', skipBoot);
                document.removeEventListener('click', skipBoot);
                if (skipHintEl) skipHintEl.remove(); // hint goes away once boot completes
                bootSkipped = false; // restore normal typing speed for command output
                setPromptVisible(true);
                inputLine.disabled = false;
                inputLine.focus();
                isTyping = false;
                try { sessionStorage.setItem('mdos-booted', '1'); } catch (e) {}
                runUrlCommand();
            };

            // Auto-skip the full boot if we've already booted this session
            let alreadyBooted = false;
            try { alreadyBooted = sessionStorage.getItem('mdos-booted') === '1'; } catch (e) {}
            if (alreadyBooted) {
                SoundFX.dataBurst();
                await typeRaw(`<div class="ascii-art">${ASCII_ART}</div>`);
                await typeLine(`Welcome back, ${termUser}. Type 'help' for a list of commands.`, 5);
                finishReady();
                return;
            }

            await new Promise(r => setTimeout(r, 500));

            // From here on, any key / click fast-forwards the boot
            document.addEventListener('keydown', skipBoot);
            document.addEventListener('click', skipBoot);

            SoundFX.dataBurst();
            await typeRaw(`<div class="ascii-art">${ASCII_ART}</div>`);
            skipHintEl = document.createElement('div');
            skipHintEl.className = 'output';
            skipHintEl.innerHTML = `<span class="highlight-dim">[ press any key to skip ]</span>`;
            outputContainer.appendChild(skipHintEl);
            terminal.scrollTop = terminal.scrollHeight;

            SoundFX.compute();
            await typeLine("Booting MIIT-DAGA-OS v1.0...", 30);
            await typeProgressBar(20, 1000);
            await new Promise(r => setTimeout(r, bootSkipped ? 0 : 100));

            SoundFX.dataBurst();
            await typeLine("Connecting to network...", 30);
            await typeSpinner("Resolving DNS...", 600);
            await typeSpinner("Establishing secure tunnel...", 800);
            await typeLine("Connection established. ✓", 20);
            await new Promise(r => setTimeout(r, bootSkipped ? 0 : 100));

            SoundFX.compute();
            await typeLine("Authenticating user...", 30);
            await typeSpinner("Verifying identity", 400);
            await typeSpinner("Checking permissions", 300);
            await typeSpinner("Loading profile", 500);

            SoundFX.successChime();
            await typeLine(`Access granted. Welcome, ${termUser}.`, 30);
            await typeLine("\nType 'help' for a list of commands.", 30);
            finishReady();
        };

        // Attach event listener to overlay to start system on click/key
        const handleStart = () => {
            startSystem();
            document.removeEventListener('keydown', handleStart);
            document.removeEventListener('click', handleStart);
        };

        overlay.addEventListener('click', handleStart);
        document.addEventListener('keydown', handleStart);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const newColumns = canvas.width / fontSize;
            drops.length = Math.floor(newColumns);
            for(let i = 0; i < drops.length; i++) {
                if(!drops[i]) drops[i] = 1;
            }
        });
    </script>
</body>
</html>
