<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miit Daga - Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Default theme: teal (matches the portfolio's cosmic palette) */
            --term-primary: #2dd4bf;
            --term-accent: #67e8f9;
            --term-ghost: rgba(45, 212, 191, 0.3);
        }
        body {
            background-color: #000;
            color: var(--term-primary);
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
        }
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.3;
        }
        #terminal {
            width: 100%;
            height: 100vh;
            padding: 1.5rem;
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
        }
        #terminal::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }
        .prompt::before {
            /* Driven by --term-user so `login` can change it; see applyUser(). */
            content: var(--term-user, 'intruder') '@miit-daga:~$ \00a0';
            color: var(--term-primary);
            font-weight: 700;
        }
        .output {
            white-space: pre-wrap;
        }
        .input-container {
            position: relative;
            flex-grow: 1;
            height: 1.5em; 
        }
        #input-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            caret-color: var(--term-primary);
            background: transparent;
            border: none;
            outline: none;
            color: var(--term-primary);
            font-family: 'Roboto Mono', monospace;
            z-index: 10;
        }
        #ghost-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--term-ghost);
            font-family: 'Roboto Mono', monospace;
            z-index: 5;
            pointer-events: none;
        }
        .nav-link {
            color: var(--term-accent);
            text-decoration: underline;
            cursor: pointer;
        }
        .nav-link:hover {
            background-color: var(--term-accent);
            color: #000;
        }
        .section-title {
            color: var(--term-accent);
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .ascii-art {
            white-space: pre;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
            color: var(--term-primary);
        }
        .error-text { color: #ff3333; }
        .highlight-name { color: #fff; font-weight: 700; }
        .highlight-date { color: #888; }
        .highlight-dim { color: #6a6; }
        .highlight-value { color: var(--term-accent); }
        .help-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.25rem 2rem;
            margin-top: 0.5rem;
        }
        .help-category {
            color: #888;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8em;
            margin-top: 0.75rem;
            margin-bottom: 0.25rem;
            letter-spacing: 0.1em;
        }
        /* Overlay Style */
        #start-overlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>

        const SoundFX = {
            ctx: null,
            isMuted: false,
            
            init: function() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                } else if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },

            playTone: function(freq, type, duration, vol = 0.1) {
                if (this.isMuted || !this.ctx || this.ctx.state !== 'running') return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.frequency.value = freq;
                osc.type = type;
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                const now = this.ctx.currentTime;
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(vol, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                
                osc.start(now);
                osc.stop(now + duration);
            },

            // --- USER TYPING SOUNDS ---
            typing: function(key) {
                if (this.isMuted) return;

                let freq = 800;
                let type = 'square';
                let duration = 0.06;
                let vol = 0.05;

                if (key >= '0' && key <= '9') {
                    const num = parseInt(key);
                    freq = 1000 + (num * 100); 
                    type = 'sine'; 
                    duration = 0.08;
                    vol = 0.08;
                }
                else if (key.length === 1 && key.match(/[a-z]/i)) {
                    const code = key.toLowerCase().charCodeAt(0) - 97; 
                    freq = 200 + (code * 15);
                    type = 'square'; 
                }
                else if (key === ' ') {
                    freq = 120;
                    type = 'sawtooth';
                    duration = 0.05;
                    vol = 0.08;
                }
                else if (key === 'Backspace') {
                    freq = 100;
                    type = 'sawtooth';
                    duration = 0.08;
                }
                else {
                    freq = 800;
                    type = 'triangle';
                }

                this.playTone(freq, type, duration, vol);
            },

            // --- SYSTEM SOUNDS ---
            startup: function() {
                if (this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 2);
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.1, now + 1);
                gain.gain.linearRampToValueAtTime(0, now + 2);

                osc.start(now);
                osc.stop(now + 2);
            },

            dataBurst: function() {
                if (this.isMuted || !this.ctx) return;
                const count = 15;
                for(let i=0; i<count; i++) {
                    setTimeout(() => {
                        this.playTone(400 + Math.random() * 800, 'square', 0.05, 0.03);
                    }, i * 30);
                }
            },

            compute: function() {
                if (this.isMuted || !this.ctx) return;
                this.playTone(200 + Math.random() * 50, 'sawtooth', 0.1, 0.05);
            },

            deleteProcess: function() {
                // Low crunching/processing sound
                if (this.isMuted || !this.ctx) return;
                const count = 6;
                for(let i=0; i<count; i++) {
                    setTimeout(() => {
                        this.playTone(100, 'square', 0.05, 0.05);
                    }, i * 150);
                }
            },

            funny: function() {
                // A "slide whistle" / clown sound
                if (this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.type = 'triangle';
                const now = this.ctx.currentTime;
                
                // Slide up then down
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                osc.frequency.linearRampToValueAtTime(300, now + 0.4);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);

                osc.start(now);
                osc.stop(now + 0.4);
            },

            successChime: function() {
                if (this.isMuted || !this.ctx) return;
                [440, 554, 659].forEach((freq, i) => { 
                    setTimeout(() => {
                        this.playTone(freq, 'sine', 0.6, 0.05);
                    }, i * 100);
                });
            },

            enter: function() {
                if (this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            },

            error: function() {
                this.playTone(150, 'sawtooth', 0.2, 0.1);
            },

            meow: function() {
                if (this.isMuted) return;
                const audio = new Audio('meow.mp3');

                if (this.isMuted || !this.ctx) return;

                    setTimeout(() => {
                        this.playTone(Math.random() * 1000, 'sawtooth', 0.05, 0.05);

                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1);
                osc.start();
                osc.stop(this.ctx.currentTime + 1);
            }
        };

        // --- MATRIX CANVAS ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const characters = katakana + alphabet;
        
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        // Drives the matrix rain colour; updated by the `theme` command.
        let matrixColor = '#2dd4bf';

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = matrixColor;
            ctx.font = fontSize + 'px "Roboto Mono"';
            for(let i = 0; i < drops.length; i++) {
                const text = characters[Math.floor(Math.random() * characters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }

        // Pause the rain while the tab is hidden to save CPU/battery.
        let matrixTimer = setInterval(drawMatrix, 40);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(matrixTimer);
                matrixTimer = null;
            } else if (!matrixTimer) {
                matrixTimer = setInterval(drawMatrix, 40);
            }
        });

        const THEMES = {
            teal:  { primary: '#2dd4bf', accent: '#67e8f9', ghost: 'rgba(45, 212, 191, 0.3)' },
            green: { primary: '#00ff00', accent: '#00ffff', ghost: 'rgba(0, 255, 0, 0.3)' },

        // Resolve any CSS color (named / hex / rgb / hsl) to {r,g,b}, or null if invalid.
        function resolveColor(input) {
            if (!input || !window.CSS || !CSS.supports('color', input)) return null;
            const el = document.createElement('span');
            el.style.color = input;
            el.style.display = 'none';
            document.body.appendChild(el);
            const computed = getComputedStyle(el).color;
            document.body.removeChild(el);
            const m = computed.match(/\d+(\.\d+)?/g);
            if (!m || m.length < 3) return null;
            return { r: +m[0], g: +m[1], b: +m[2] };
        }

        function applyTheme(name) {
            name = (name || '').toLowerCase().trim();
            let primary, accent, ghost;

            if (THEMES[name]) {
                ({ primary, accent, ghost } = THEMES[name]);
            } else {
                // Treat the argument as an arbitrary CSS colour.
                const c = resolveColor(name);
                if (!c) return false;
                const lighten = (v) => Math.round(v + (255 - v) * 0.45);
                primary = `rgb(${c.r}, ${c.g}, ${c.b})`;
                accent = `rgb(${lighten(c.r)}, ${lighten(c.g)}, ${lighten(c.b)})`;
                ghost = `rgba(${c.r}, ${c.g}, ${c.b}, 0.3)`;
            }

            const root = document.documentElement.style;
            root.setProperty('--term-primary', primary);
            root.setProperty('--term-accent', accent);
            root.setProperty('--term-ghost', ghost);
            matrixColor = primary;
            try { localStorage.setItem('term-theme', name); } catch (e) {}
            return true;

        // --- "Did you mean?" via Levenshtein distance ---
        function levenshtein(a, b) {
            const m = a.length, n = b.length;
            const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
            for (let j = 0; j <= n; j++) dp[0][j] = j;
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
                }
            }
            return dp[m][n];
        }

        function closestCommand(input) {
            let best = null, bestDist = Infinity;
            for (const cmd of MOCK_DATA.commands) {
                const d = levenshtein(input, cmd);
                if (d < bestDist) { bestDist = d; best = cmd; }
            }
            return bestDist <= 3 && best !== input ? best : null;

        function argTargets(cmd) {

        inputLine.addEventListener('input', () => {
            const raw = inputLine.value;

            const spaceIdx = raw.indexOf(' ');
            if (spaceIdx !== -1) {
                // "<cmd> <partial-arg>" -> suggest a matching argument
                const cmd = raw.slice(0, spaceIdx);
                const argPartial = raw.slice(spaceIdx + 1).toLowerCase();
                const targets = argTargets(cmd);
                if (targets.length) {
                    const m = targets.find(t => t.toLowerCase().startsWith(argPartial));
                    if (m) ghostInput.value = cmd + ' ' + m;
                }

                const match = MOCK_DATA.commands.find(c => c.startsWith(raw.toLowerCase()));

        function typeLine(line, delay = 20) {
            if (captureBuffer) { captureBuffer.push(line); return Promise.resolve(); }
            return new Promise(resolve => {
                let i = 0;
                const p = document.createElement('div');
                p.className = 'output';
                outputContainer.appendChild(p);
                
                function type() {
                    if (bootSkipped) {
                        p.innerHTML = line;
                        terminal.scrollTop = terminal.scrollHeight;
                        resolve();
                        return;
                    }
                    if (i < line.length) {
                        p.innerHTML += line.charAt(i);
                        i++;
                        terminal.scrollTop = terminal.scrollHeight;
                        setTimeout(type, delay);
                    } else {
                        resolve();
                    }

                type();
            });
        }
        
        function typeRaw(html, delay = 20) {

        function typeProgressBar(steps = 20, duration = 1200) {
            if (captureBuffer) return Promise.resolve(); // progress chrome is not pipeable output
            return new Promise(resolve => {
                const p = document.createElement('div');
                p.className = 'output';
                outputContainer.appendChild(p);
                let i = 0;
                const interval = duration / steps;
                function update() {
                    if (bootSkipped) {
                        p.innerHTML = `  [${'█'.repeat(steps)}] 100%`;
                        terminal.scrollTop = terminal.scrollHeight;
                        resolve();
                        return;
                    }
                    if (i <= steps) {
                        const filled = '█'.repeat(i);
                        const empty = '░'.repeat(steps - i);
                        const pct = Math.round((i / steps) * 100);
                        p.innerHTML = `  [${filled}${empty}] ${pct}%`;
                        terminal.scrollTop = terminal.scrollHeight;
                        i++;
                        setTimeout(update, interval);
                    } else {
                        resolve();
                    }
                }
                update();
            });
        }

        function typeSpinner(text, duration = 1000) {
            if (captureBuffer) return Promise.resolve(); // spinner chrome is not pipeable output
            return new Promise(resolve => {
                const p = document.createElement('div');
                p.className = 'output';
                outputContainer.appendChild(p);
                const frames = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
                let i = 0;
                const interval = 80;
                const start = Date.now();
                function update() {
                    if (!bootSkipped && Date.now() - start < duration) {
                        p.innerHTML = `  ${frames[i % frames.length]} ${text}`;
                        i++;

                        setTimeout(update, interval);
                    } else {
                        p.innerHTML = `  <span style="color:var(--term-primary)">✓</span> ${text}`;
                        terminal.scrollTop = terminal.scrollHeight;
                        resolve();
                    }

                update();
            });
        }

        // During a pipeline the source command runs in capture mode, where the
        // input must stay disabled until the whole chain has rendered, so this

        function endTurn() {

            setPromptVisible(true);
            inputLine.disabled = false;
            inputLine.focus();
            isTyping = false;
            terminal.scrollTop = terminal.scrollHeight;

        // --- SNAKE mini-game (launched via `play snake`) ---
        function startSnakeGame() {
            return new Promise((resolve) => {

                const accent = ((getComputedStyle(root).getPropertyValue('--term-accent') || '#67e8f9').trim()) || '#67e8f9';
                const GRID = 22, CELL = 16, SIZE = GRID * CELL;

                const overlay = document.createElement('div');
                overlay.style.cssText = "position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,0.88);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-family:'Roboto Mono',monospace;";

                const title = document.createElement('div');
                title.style.cssText = "color:" + primary + ";font-weight:700;letter-spacing:0.35em;font-size:18px;";
                title.textContent = 'S N A K E';

                const scoreBar = document.createElement('div');
                scoreBar.style.cssText = "color:" + accent + ";font-size:13px;display:flex;gap:28px;";

                const canvas = document.createElement('canvas');
                canvas.width = SIZE; canvas.height = SIZE;
                canvas.style.cssText = "border:1px solid " + primary + ";border-radius:8px;box-shadow:0 0 18px " + primary + ";max-width:90vw;height:auto;";
                const ctx = canvas.getContext('2d');

                const hint = document.createElement('div');
                hint.style.cssText = "color:#888;font-size:11px;text-align:center;";
                hint.innerHTML = "Arrows / WASD to move &nbsp;&middot;&nbsp; Q to quit";

                overlay.appendChild(title);
                overlay.appendChild(scoreBar);
                overlay.appendChild(canvas);
                overlay.appendChild(hint);
                document.body.appendChild(overlay);

                let high = 0;
                try { high = parseInt(localStorage.getItem('snake-highscore') || '0', 10) || 0; } catch (e) {}

                let snake, dir, nextDir, food, score, tickMs, loop, over;

                function placeFood() {
                    do { food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) }; }
                    while (snake.some(s => s.x === food.x && s.y === food.y));
                }
                function updateBar() {
                    scoreBar.innerHTML = "<span>SCORE <b style='color:" + primary + "'>" + score + "</b></span><span>HIGH <b style='color:" + primary + "'>" + Math.max(high, score) + "</b></span>";
                }
                function restartLoop() { clearInterval(loop); loop = setInterval(tick, tickMs); }
                function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

                    ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, SIZE, SIZE);

                    for (let i = 1; i < GRID; i++) {

                    for (let i = 0; i < snake.length; i++) {
                        const s = snake[i];
                        if (i === 0) { ctx.fillStyle = '#ffffff'; ctx.shadowColor = primary; ctx.shadowBlur = 12; }
                        else { ctx.fillStyle = primary; ctx.shadowBlur = 0; }
                        roundRect(ctx, s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 4);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                    if (over) {
                        ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, SIZE, SIZE);
                        ctx.textAlign = 'center';
                        ctx.fillStyle = primary; ctx.font = "bold 22px 'Roboto Mono', monospace";
                        ctx.fillText('GAME OVER', SIZE / 2, SIZE / 2 - 8);
                        ctx.fillStyle = '#bbbbbb'; ctx.font = "12px 'Roboto Mono', monospace";
                        ctx.fillText('Score ' + score + '  ·  High ' + Math.max(high, score), SIZE / 2, SIZE / 2 + 16);
                        ctx.fillText('R to restart  ·  Q to quit', SIZE / 2, SIZE / 2 + 36);
                    }
                }

                function tick() {
                    dir = nextDir;
                    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
                    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID || snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

                    if (head.x === food.x && head.y === food.y) {
                        score++;

                        if (score % 4 === 0 && tickMs > 75) { tickMs -= 6; restartLoop(); }

                    }

                function gameOver() {
                    over = true; clearInterval(loop);
                    if (typeof SoundFX !== 'undefined') SoundFX.powerDown();
                    if (score > high) { high = score; try { localStorage.setItem('snake-highscore', String(high)); } catch (e) {} }
                    hint.innerHTML = "R to restart &nbsp;&middot;&nbsp; Q to quit";
                    updateBar(); draw();
                }

                function reset() {
                    const c = Math.floor(GRID / 2);
                    snake = [{ x: c, y: c }, { x: c - 1, y: c }, { x: c - 2, y: c }];
                    dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };

                function onKey(e) {

                function cleanup() {
                    clearInterval(loop);
                    document.removeEventListener('keydown', onKey, true);
                    overlay.remove();
                    resolve();
                }

                document.addEventListener('keydown', onKey, true);
                reset();
            });
        }

        // --- SPACE INVADERS (play invaders) ---
        function startInvadersGame() {
            return new Promise((resolve) => {
                const W = 360, H = 400;
                const ui = makeGameOverlay('I N V A D E R S', W, H);
                const ctx = ui.ctx, primary = ui.primary, accent = ui.accent, scoreBar = ui.scoreBar, hint = ui.hint, overlay = ui.overlay;
                const PW = 26, PH = 12, PSPEED = 4, BSPEED = 6, EBSPEED = 3.2;
                const keys = {};
                let player, bullets, ebullets, aliens, dirX, score, wave, over, loop, lastShot;
                let high = 0; try { high = parseInt(localStorage.getItem('invaders-highscore') || '0', 10) || 0; } catch (e) {}
                function spawnWave() {
                    aliens = [];
                    const cols = 8, rows = 4, gx = 28, gy = 28, sx = 38, sy = 28;
                    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) aliens.push({ x: gx + c * sx, y: gy + r * sy, w: 22, h: 16, alive: true });
                    dirX = 1;
                }
                function alive() { return aliens.filter(a => a.alive); }
                function updateBar() { scoreBar.innerHTML = "<span>SCORE <b style='color:" + primary + "'>" + score + "</b></span><span>WAVE <b style='color:" + primary + "'>" + wave + "</b></span><span>HIGH <b style='color:" + primary + "'>" + Math.max(high, score) + "</b></span>"; }
                function restartLoop() { clearInterval(loop); loop = setInterval(step, 1000 / 30); }
                function reset() {
                    player = { x: W / 2 - PW / 2, y: H - 26 };
                    bullets = []; ebullets = []; score = 0; wave = 1; over = false; lastShot = 0;
                    spawnWave(); updateBar();
                    hint.innerHTML = "Arrows / AD to move &nbsp;&middot;&nbsp; Space to shoot &nbsp;&middot;&nbsp; Q to quit";
                    restartLoop();
                }
                function step() {
                    if (over) return;
                    if (keys['arrowleft'] || keys['a']) player.x -= PSPEED;
                    if (keys['arrowright'] || keys['d']) player.x += PSPEED;
                    player.x = Math.max(4, Math.min(W - PW - 4, player.x));
                    const now = Date.now();
                    if ((keys[' '] || keys['spacebar']) && now - lastShot > 300) { bullets.push({ x: player.x + PW / 2, y: player.y - 6 }); lastShot = now; if (typeof SoundFX !== 'undefined' && SoundFX.playTone) SoundFX.playTone(880, 'square', 0.05, 0.03); }
                    for (const b of bullets) b.y -= BSPEED;
                    bullets = bullets.filter(b => b.y > -10);
                    const aa = alive();
                    const speed = Math.min(3.4, 0.5 + (wave - 1) * 0.35 + (32 - aa.length) * 0.06);
                    let edge = false;
                    for (const a of aa) { a.x += dirX * speed; if (a.x < 4 || a.x + a.w > W - 4) edge = true; }
                    if (edge) { dirX *= -1; for (const a of aa) a.y += 14; }
                    if (aa.length && Math.random() < 0.025 + wave * 0.004) { const sh = aa[Math.floor(Math.random() * aa.length)]; ebullets.push({ x: sh.x + sh.w / 2, y: sh.y + sh.h }); }
                    for (const b of ebullets) b.y += EBSPEED;
                    ebullets = ebullets.filter(b => b.y < H + 10);
                    for (const b of bullets) { for (const a of aa) { if (a.alive && b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) { a.alive = false; b.y = -999; score += 10; if (typeof SoundFX !== 'undefined' && SoundFX.playTone) SoundFX.playTone(440, 'square', 0.06, 0.04); break; } } }
                    bullets = bullets.filter(b => b.y > -10);
                    updateBar();
                    for (const b of ebullets) { if (b.x > player.x && b.x < player.x + PW && b.y > player.y && b.y < player.y + PH) { gameOver(); return; } }
                    for (const a of aa) { if (a.y + a.h >= player.y) { gameOver(); return; } }
                    if (aa.length === 0) { wave++; spawnWave(); }

                }
                function draw() {
                    ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = primary; ctx.shadowColor = primary; ctx.shadowBlur = 8;
                    ctx.beginPath(); ctx.moveTo(player.x + PW / 2, player.y); ctx.lineTo(player.x, player.y + PH); ctx.lineTo(player.x + PW, player.y + PH); ctx.closePath(); ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffffff'; for (const b of bullets) ctx.fillRect(b.x - 1.5, b.y, 3, 8);
                    ctx.fillStyle = accent; for (const b of ebullets) ctx.fillRect(b.x - 1.5, b.y, 3, 8);
                    for (const a of aliens) { if (!a.alive) continue; ctx.fillStyle = accent; ctx.shadowColor = accent; ctx.shadowBlur = 6; ctx.fillRect(a.x + 3, a.y + 3, a.w - 6, a.h - 6); ctx.shadowBlur = 0; ctx.fillStyle = '#05070a'; ctx.fillRect(a.x + 6, a.y + 6, 3, 3); ctx.fillRect(a.x + a.w - 9, a.y + 6, 3, 3); }
                    ctx.shadowBlur = 0;
                    if (over) endText(ctx, W, H, primary, score, high);
                }
                function gameOver() { over = true; clearInterval(loop); if (typeof SoundFX !== 'undefined' && SoundFX.powerDown) SoundFX.powerDown(); if (score > high) { high = score; try { localStorage.setItem('invaders-highscore', String(high)); } catch (e) {} } hint.innerHTML = "R to restart &nbsp;&middot;&nbsp; Q to quit"; updateBar(); draw(); }
                function onKey(e) { const k = (e.key || '').toLowerCase(); if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'a', 'd', ' ', 'spacebar'].indexOf(k) !== -1) e.preventDefault(); if (k === 'q' || k === 'escape') { e.preventDefault(); cleanup(); return; } if (k === 'r' && over) { e.preventDefault(); reset(); return; } keys[k] = true; }
                function onKeyUp(e) { keys[(e.key || '').toLowerCase()] = false; }
                function cleanup() { clearInterval(loop); document.removeEventListener('keydown', onKey, true); document.removeEventListener('keyup', onKeyUp, true); overlay.remove(); resolve(); }
                document.addEventListener('keydown', onKey, true); document.addEventListener('keyup', onKeyUp, true);
                reset();
            });
        }

        // --- METEOR DODGE (play dodge) ---
        function startMeteorDodge() {
            return new Promise((resolve) => {
                const W = 340, H = 420;
                const ui = makeGameOverlay('M E T E O R   D O D G E', W, H);
                const ctx = ui.ctx, primary = ui.primary, accent = ui.accent, scoreBar = ui.scoreBar, hint = ui.hint, overlay = ui.overlay;
                const PW = 22, PH = 16, PSPEED = 4.5, PY = H - 30;
                const keys = {};
                let player, meteors, score, t, over, loop, spawnAcc;
                let high = 0; try { high = parseInt(localStorage.getItem('dodge-highscore') || '0', 10) || 0; } catch (e) {}
                function updateBar() { scoreBar.innerHTML = "<span>SCORE <b style='color:" + primary + "'>" + score + "</b></span><span>HIGH <b style='color:" + primary + "'>" + Math.max(high, score) + "</b></span>"; }
                function restartLoop() { clearInterval(loop); loop = setInterval(step, 1000 / 40); }
                function reset() { player = { x: W / 2 - PW / 2 }; meteors = []; score = 0; t = 0; over = false; spawnAcc = 0; updateBar(); hint.innerHTML = "Arrows / AD to dodge &nbsp;&middot;&nbsp; Q to quit"; restartLoop(); }
                function step() {
                    if (over) return;
                    t++;
                    if (t % 4 === 0) { score++; updateBar(); }
                    const fall = 2.2 + Math.min(4.5, t / 500);
                    if (keys['arrowleft'] || keys['a']) player.x -= PSPEED;
                    if (keys['arrowright'] || keys['d']) player.x += PSPEED;
                    player.x = Math.max(4, Math.min(W - PW - 4, player.x));
                    spawnAcc++;
                    const every = Math.max(9, 24 - Math.floor(t / 250));
                    if (spawnAcc >= every) { spawnAcc = 0; const r = 8 + Math.random() * 13; meteors.push({ x: r + Math.random() * (W - 2 * r), y: -r, r: r, vy: fall + Math.random() * 1.5 }); }
                    for (const m of meteors) m.y += m.vy;
                    meteors = meteors.filter(m => m.y - m.r < H + 20);
                    for (const m of meteors) {
                        const cx = Math.max(player.x, Math.min(m.x, player.x + PW));
                        const cy = Math.max(PY, Math.min(m.y, PY + PH));
                        const dx = m.x - cx, dy = m.y - cy;
                        if (dx * dx + dy * dy < m.r * m.r) { gameOver(); return; }
                    }
                    draw();
                }
                function draw() {
                    ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, W, H);

        // --- PIPES -------------------------------------------------------
        // `experience | grep aws | wc -l`. The source command runs in capture
        // mode so its rendered lines land in an array, then each stage filters
        // that array before anything reaches the DOM. No individual command
        // needs to know pipes exist.

        // Only pure-output commands make sense as a source. Anything
        // interactive or side-effecting (play, reboot, exit, resume) is refused.
        const PIPEABLE = new Set([
            // `help` is deliberately absent: it renders one multi-column grid as a
            // single block, so filtering it by line is meaningless.
            'brief', 'about', 'experience', 'education', 'skills',
            'achievements', 'projects', 'publications', 'contact', 'socials',
            'guestbook', 'man', 'ls', 'history', 'neofetch', 'date', 'pwd', 'whoami',
            'find', 'tree', 'fortune', 'stats', 'alias', 'curl', 'leaderboard',
        ]);
        const PIPE_STAGES = ['grep', 'wc', 'head', 'tail'];

        function isPipeline(command) {
            const i = command.indexOf('|');
            return i > 0 && command.slice(i + 1).trim().length > 0;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, (c) => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }
        function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

        // Rendered lines are HTML. grep has to match what the visitor sees, so
        // strip to text content before testing.
        const HTML_PROBE = document.createElement('div');
        function lineText(html) {
            HTML_PROBE.innerHTML = html;
            return HTML_PROBE.textContent || '';
        }

        // Highlight matches without corrupting the surrounding markup: walk text
        // nodes only, so a hit inside <span class="nav-link"> keeps its span.
        function highlightMatches(html, re) {
            const host = document.createElement('div');
            host.innerHTML = html;
            const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);
            for (const node of nodes) {
                const text = node.nodeValue;
                re.lastIndex = 0;
                if (!re.test(text)) continue;
                re.lastIndex = 0;
                const frag = document.createDocumentFragment();
                let last = 0, m;
                while ((m = re.exec(text)) !== null) {
                    if (m[0].length === 0) { re.lastIndex++; continue; }
                    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
                    const mark = document.createElement('span');
                    mark.style.cssText = 'color:#000;background:var(--term-accent);font-weight:700;border-radius:2px;';
                    mark.textContent = m[0];
                    frag.appendChild(mark);
                    last = m.index + m[0].length;
                }
                if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
                node.parentNode.replaceChild(frag, node);
            }
            return host.innerHTML;
        }

        function applyStage(stage, lines) {
            const parts = stage.split(/\s+/).filter(Boolean);
            const name = (parts[0] || '').toLowerCase();
            const flags = parts.slice(1).filter((p) => p.startsWith('-'));
            const args = parts.slice(1).filter((p) => !p.startsWith('-'));
            const hasFlag = (ch) => flags.some((f) => f.slice(1).includes(ch));
            // Supports both `head -n 5` and `head -5`.
            const count = (fallback) => {
                const fromArgs = args.find((a) => /^\d+$/.test(a));
                if (fromArgs) return Number(fromArgs);
                const bare = flags.map((f) => f.match(/^-(\d+)$/)).find(Boolean);
                if (bare) return Number(bare[1]);
                return fallback;
            };
            const nonEmpty = (ls) => ls.filter((l) => lineText(l).trim().length > 0);

            if (name === 'grep') {
                const pattern = args.join(' ');
                if (!pattern) throw new Error('grep: missing pattern. Usage: grep [-i] [-v] <pattern>');
                // Smart case: lowercase patterns match case-insensitively.
                const insensitive = hasFlag('i') || !/[A-Z]/.test(pattern);
                const invert = hasFlag('v');
                const re = new RegExp(escapeRegExp(pattern), insensitive ? 'gi' : 'g');
                const out = [];
                for (const line of nonEmpty(lines)) {
                    re.lastIndex = 0;
                    const hit = re.test(lineText(line));
                    if (hit !== invert) out.push(invert ? line : highlightMatches(line, re));
                }
                return out;
            }
            if (name === 'wc') return [String(nonEmpty(lines).length)];
            if (name === 'head') return lines.slice(0, count(10));
            if (name === 'tail') return lines.slice(-count(10));
            throw new Error(`${name}: unknown filter. Available: ${PIPE_STAGES.join(', ')}`);
        }

        async function runPipeline(command) {
            const segments = command.split('|').map((s) => s.trim());
            const source = segments[0];
            const stages = segments.slice(1);
            const sourceName = source.split(/\s+/)[0].toLowerCase();

            if (!PIPEABLE.has(sourceName)) {
                SoundFX.error();
                await typeRaw(`<span class="error-text">${escapeHtml(sourceName || 'that')}: output cannot be piped.</span>`);
                await typeRaw(`Pipeable sources: <span class="highlight-value">${[...PIPEABLE].sort().join(' ')}</span>`);
                return;
            }

            let lines = [];
            let sourceError = null;
            captureBuffer = [];
            try {
                await executeCommand(source);
            } catch (err) {
                // Reported after the finally below, never inside it: capture mode
                // is still on here, so an error rendered now would be swallowed
                // into the buffer instead of reaching the screen.
                sourceError = err;
            } finally {
                lines = captureBuffer || [];
                captureBuffer = null;
            }
            if (sourceError) {
                SoundFX.error();
                await typeRaw(`<span class="error-text">${escapeHtml(source)}: ${escapeHtml(sourceError.message || 'command failed')}</span>`);
                return;
            }

            try {
                for (const stage of stages) lines = applyStage(stage, lines);
            } catch (err) {
                SoundFX.error();
                await typeRaw(`<span class="error-text">${escapeHtml(err.message)}</span>`);
                return;
            }

            if (!lines.length) {
                SoundFX.error();
                await typeRaw('<span class="highlight-dim">(no matches)</span>');
                return;
            }
            for (const line of lines) await typeRaw(line);
        }

        const ALIAS_KEY = 'term-aliases';

        const ALIAS_NAME_RE = /^[a-z][a-z0-9_-]{0,15}$/i;
        let aliases = {};
        try {
            const parsed = JSON.parse(localStorage.getItem(ALIAS_KEY) || '{}');
            if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) aliases = parsed;

        // Expands the FIRST word only, and only one level deep, so
        // `alias a=b` together with `alias b=a` can never loop.
        function expandAlias(segment) {
            const trimmed = (segment || '').trim();
            if (!trimmed) return trimmed;
            const sp = trimmed.search(/\s/);
            const head = (sp === -1 ? trimmed : trimmed.slice(0, sp)).toLowerCase();
            const tail = sp === -1 ? '' : trimmed.slice(sp);
            const target = aliases[head];
            return target ? target + tail : trimmed;
        }

        async function manageAlias(arg) {
            const names = Object.keys(aliases).sort();
            if (!arg) {
                SoundFX.enter();
                if (!names.length) {
                    await typeRaw('<span class="highlight-dim">No aliases set.</span>');
                    await typeRaw('Usage: alias &lt;name&gt;=&lt;command&gt;   e.g. <span class="highlight-value">alias p=projects</span>');
                    return;
                }
                await typeRaw('<div class="section-title">Aliases</div>');
                for (const n of names) {
                    await typeRaw(`  <span class="highlight-name">${escapeHtml(n)}</span>=<span class="highlight-value">${escapeHtml(aliases[n])}</span>`);
                }
                return;
            }

            const eq = arg.indexOf('=');
            if (eq === -1) {
                const name = arg.trim().toLowerCase();
                if (aliases[name]) {
                    SoundFX.enter();
                    await typeRaw(`<span class="highlight-name">${escapeHtml(name)}</span>=<span class="highlight-value">${escapeHtml(aliases[name])}</span>`);
                } else {
                    SoundFX.error();
                    await typeRaw(`<span class="error-text">alias: ${escapeHtml(name)}: not found</span>`);
                }
                return;
            }

            const name = arg.slice(0, eq).trim().toLowerCase();
            const value = arg.slice(eq + 1).trim();
            if (!ALIAS_NAME_RE.test(name)) {
                SoundFX.error();
                await typeRaw('<span class="error-text">alias: names must start with a letter and be 1-16 characters of a-z, 0-9, - or _</span>');
                return;
            }
            if (!value) {
                SoundFX.error();
                await typeRaw('<span class="error-text">alias: give it something to expand to, or use unalias to remove it</span>');
                return;
            }
            if (value.length > 120) {
                SoundFX.error();
                await typeRaw('<span class="error-text">alias: that expansion is too long (120 characters max)</span>');
                return;
            }
            if (!aliases[name] && names.length >= MAX_ALIASES) {
                SoundFX.error();
                await typeRaw(`<span class="error-text">alias: ${MAX_ALIASES} is the limit. Remove one with unalias first.</span>`);
                return;
            }
            aliases[name] = value;
            saveAliases();
            SoundFX.successChime();
            await typeRaw(`<span class="highlight-name">${escapeHtml(name)}</span>=<span class="highlight-value">${escapeHtml(value)}</span>`);
            if (MOCK_DATA.commands.includes(name)) {
                await typeRaw(`<span class="highlight-dim">Heads up: this shadows the built-in '${escapeHtml(name)}'. unalias ${escapeHtml(name)} restores it.</span>`);

        }

        // --- COMMAND CHAINING ----------------------------------------------
        // `a && b` runs b only if a was a command we recognise; `a ; b` always
        // runs b. Splitting happens before pipes, matching shell precedence.
        const CHAIN_LIMIT = 10;

        // Commands whose argument is free-form text. `sign hi; bye` must post the
        // whole message, not post "hi" and then try to run "bye".
        const RAW_TAIL = new Set(['sign', 'alias', 'find', 'theme', 'curl', 'open']);

        function splitChain(input) {
            const whole = String(input || '').trim();
            const base = expandAlias(whole).split(/\s+/)[0].toLowerCase();
            if (RAW_TAIL.has(base)) return whole ? [{ text: whole, sep: null }] : [];

            const out = [];
            let rest = String(input || '');
            let sep = null;
            for (let guard = 0; guard < 64; guard++) {
                const m = rest.match(/(&&|;)/);
                if (!m) { out.push({ text: rest.trim(), sep }); break; }
                out.push({ text: rest.slice(0, m.index).trim(), sep });
                sep = m[1];
                rest = rest.slice(m.index + m[1].length);
            }
            return out.filter((seg) => seg.text).slice(0, CHAIN_LIMIT);
        }

        // Commands that exist but are deliberately absent from the public list.
        const HIDDEN_COMMANDS = new Set(['jettison', 'unalias']);
        function isKnownCommand(text) {
            const base = (text || '').trim().split(/\s+/)[0].toLowerCase();
            if (!base) return false;
            return MOCK_DATA.commands.includes(base) || HIDDEN_COMMANDS.has(base);
        }

        // --- DEEP LINKS ----------------------------------------------------
        // terminal.html?cmd=publications runs that command once the boot
        // finishes. Anything destructive, self-repeating or able to write on a
        // visitor's behalf is refused, so a crafted link cannot act for them.
        const URL_CMD_BLOCKED = new Set([
            'reboot', 'exit', 'home', 'back',   // would loop or close the tab
            'sign', 'jettison',                  // would write or delete
            'clear', 'mute',                     // pointless from a link
        ]);

        function runUrlCommand() {
            let raw = '';
            try {
                raw = (new URLSearchParams(window.location.search).get('cmd') || '').trim();
            } catch (e) { return; }
            if (!raw) return;
            if (raw.length > 120) return;

            // Drop the parameter immediately: a reload must not re-run it, and
            // that also removes any chance of a self-triggering loop.
            try { history.replaceState(null, '', window.location.pathname); } catch (e) {}

            const segments = splitChain(raw);
            if (!segments.length) return;
            const refused = segments.some((seg) => {
                const base = expandAlias(seg.text).trim().split(/\s+/)[0].toLowerCase();
                return URL_CMD_BLOCKED.has(base);
            });
            if (refused) return;

            window.setTimeout(() => { if (!isTyping) runCommand(raw); }, 450);
        }

        // --- find ----------------------------------------------------------
        // grep filters one command's output; this searches everything at once.
        function countMatches(haystack, needle) {
            if (!haystack) return 0;
            const hay = haystack.toLowerCase();
            let n = 0, i = 0;
            // Plain indexOf, never a regex, so a query full of metacharacters
            // is just a query.
            while ((i = hay.indexOf(needle, i)) !== -1) { n++; i += needle.length; }
            return n;
        }

        async function findAcross(term) {

            if (q.length < 2) {

                return;

            SoundFX.enter();
            await typeRaw(`<div class="section-title">Searching for "${escapeHtml(term.trim())}"</div>`);

            const hits = [];
            const add = (cmd, label, n) => { if (n > 0) hits.push({ cmd, label, n }); };

            add('about', 'Introduction', countMatches(MOCK_DATA.about, q));

            for (const job of MOCK_DATA.experience) {
                const blob = [job.company, job.role, job.date]
                    .concat(job.metrics || [], job.points || []).join(' ');
                add('experience', job.company, countMatches(blob, q));
            }
            for (const edu of MOCK_DATA.education) {
                const blob = [edu.institution, edu.degree, edu.date, edu.note].join(' ');
                add('education', edu.institution, countMatches(blob, q));

            for (const [category, list] of Object.entries(MOCK_DATA.skills)) {
                add('skills', category, countMatches(list.join(' '), q));

            for (const a of MOCK_DATA.achievements) {

            }
            for (const pub of MOCK_DATA.publications) {

                add('publications', pub.venue, countMatches(blob, q));

        // --- ping ----------------------------------------------------------
        async function pingHost(target) {
            const host = (target || '').trim();
            if (!host) {
                SoundFX.error();
                await typeRaw('<span class="error-text">ping: no host given</span>');
                await typeRaw('Usage: ping &lt;host&gt;');
                await typeRaw(`Try <span class="nav-link" onclick="runCommandFromClick('ping mothership')">ping mothership</span>.`);
                return;
            }
            const safe = escapeHtml(host.slice(0, 40));
            const mothership = /mothership/i.test(host);
            SoundFX.enter();
            await typeRaw(`PING ${safe} (${mothership ? '::1' : '127.0.0.1'}): 56 data bytes`);

            const times = [];
            for (let i = 0; i < 4; i++) {
                await new Promise((r) => setTimeout(r, 260));
                // Nothing leaves the browser; this is theatre, not a probe.
                const ms = mothership
                    ? 4.2e10 + Math.random() * 1e9
                    : 12 + Math.random() * 30;
                times.push(ms);
                if (typeof SoundFX !== 'undefined') SoundFX.playTone(880, 'sine', 0.04, 0.03);
                await typeRaw(
                    `64 bytes from ${safe}: icmp_seq=${i} ttl=${mothership ? 1 : 55} ` +
                    `time=<span class="highlight-value">${mothership ? ms.toExponential(2) : ms.toFixed(1)}</span> ms`
                );
            }
            const avg = times.reduce((a, b) => a + b, 0) / times.length;
            await typeRaw(`\n--- ${safe} ping statistics ---`);
            await typeRaw('4 packets transmitted, 4 received, 0.0% packet loss');
            await typeRaw(
                `round-trip min/avg/max = ${mothership ? Math.min(...times).toExponential(2) : Math.min(...times).toFixed(1)}/` +
                `${mothership ? avg.toExponential(2) : avg.toFixed(1)}/` +
                `${mothership ? Math.max(...times).toExponential(2) : Math.max(...times).toFixed(1)} ms`

                await typeLine('That is roughly four light-years each way. Worth the wait.', 12);
            }

        // --- curl ----------------------------------------------------------
        // Real requests, not theatre. Same-origin paths are fetched directly;
        // the two allowlisted external hosts go through /api/curl, because a
        // browser cannot fetch arbitrary origins and no client-side trick
        // changes that. Anything else says so plainly.
        const CURL_MAX_DISPLAY = 4000;

        // Quote-aware, so -d '{"name":"x y"}' survives as one token.
        function tokenize(input) {
            const out = [];
            let cur = '', quote = null, started = false;
            for (const ch of String(input || '')) {
                if (quote) {
                    if (ch === quote) quote = null;
                    else cur += ch;
                } else if (ch === "'" || ch === '"') {
                    quote = ch; started = true;
                } else if (/\s/.test(ch)) {
                    if (cur || started) { out.push(cur); cur = ''; started = false; }
                } else cur += ch;
            }
            if (cur || started) out.push(cur);
            return out;
        }

        async function curlUsage(message) {
            SoundFX.error();
            if (message) await typeRaw(`<span class="error-text">curl: ${escapeHtml(message)}</span>`);
            await typeRaw('Usage: curl [-i|-I] [-s] [-X &lt;method&gt;] [-d &lt;data&gt;] &lt;url&gt;');
            await typeRaw(
                `Try <span class="nav-link" onclick="runCommandFromClick('curl /api/github-repos')">curl /api/github-repos</span>` +
                ` or <span class="nav-link" onclick="runCommandFromClick('man curl')">man curl</span>.`
            );
        }

        async function runCurl(argline) {
            const tokens = tokenize(argline);
            let url = '', method = '', data = null, showHeaders = false, headOnly = false;

            for (let i = 0; i < tokens.length; i++) {
                const t = tokens[i];
                if (t === '-i' || t === '--include') showHeaders = true;
                else if (t === '-I' || t === '--head') { headOnly = true; showHeaders = true; }
                else if (t === '-s' || t === '--silent') { /* accepted; output is always quiet */ }
                else if (t === '-X' || t === '--request') {
                    const v = tokens[++i];
                    if (!v) return curlUsage('option -X requires a method');
                    method = v.toUpperCase();
                } else if (t === '-d' || t === '--data') {
                    const v = tokens[++i];
                    if (v === undefined) return curlUsage('option -d requires data');
                    data = v;
                } else if (t.length > 1 && t.startsWith('-')) {
                    return curlUsage(`option ${t} is unknown`);
                } else if (!url) url = t;
            }

            if (!url) return curlUsage('');

            let target;
            try { target = new URL(url, window.location.origin); }
            catch (e) { return curlUsage(`could not resolve '${url}'`); }
            if (target.protocol !== 'http:' && target.protocol !== 'https:') {
                return curlUsage(`unsupported protocol: ${target.protocol.replace(':', '')}`);
            }

            const sameOrigin = target.origin === window.location.origin;
            if (!method) method = headOnly ? 'HEAD' : (data !== null ? 'POST' : 'GET');
            if (!sameOrigin && method !== 'GET' && method !== 'HEAD') {
                SoundFX.error();
                await typeRaw('<span class="error-text">curl: the proxy is read-only.</span>');
                await typeRaw('-X and -d work against this origin only, so nothing can be POSTed at a third party from here.');
                return;
            }

            SoundFX.enter();
            let result;
            try {
                if (sameOrigin) {
                    const init = { method, cache: 'no-store' };
                    if (data !== null && method !== 'GET' && method !== 'HEAD') {
                        init.body = data;
                        init.headers = { 'Content-Type': 'application/json' };
                    }
                    const res = await fetch(target.toString(), init);
                    const headers = {};
                    res.headers.forEach((v, k) => { headers[k] = v; });
                    result = {
                        status: res.status,
                        statusText: res.statusText,
                        headers,
                        body: method === 'HEAD' ? '' : await res.text(),
                        truncated: false,
                    };
                } else {
                    const res = await fetch('/api/curl?url=' + encodeURIComponent(target.toString()));
                    const payload = await res.json();
                    if (!res.ok || payload.error) {
                        SoundFX.error();
                        await typeRaw(`<span class="error-text">curl: (0) ${escapeHtml(payload.error || 'proxy refused the request')}</span>`);
                        if (Array.isArray(payload.allowed)) {
                            await typeRaw(`Browsers block cross-origin fetches. Proxied hosts: <span class="highlight-value">${escapeHtml(payload.allowed.join(' '))}</span>`);
                        }
                        return;
                    }
                    result = payload;
                }
            } catch (e) {
                SoundFX.error();
                await typeRaw(`<span class="error-text">curl: (7) failed to connect to ${escapeHtml(target.host)}</span>`);
                return;
            }

            const bad = result.status >= 400;
            if (showHeaders) {
                const line = `HTTP/1.1 ${result.status} ${result.statusText || ''}`.trim();
                await typeRaw(`<span class="${bad ? 'error-text' : 'highlight-value'}">${escapeHtml(line)}</span>`);
                for (const [k, v] of Object.entries(result.headers || {})) {
                    await typeRaw(`<span class="highlight-dim">${escapeHtml(k)}:</span> ${escapeHtml(String(v))}`);
                }
                if (!headOnly) await typeRaw('');
            }
            if (headOnly) return;

            let body = String(result.body ?? '');
            if (!body) {
                await typeRaw('<span class="highlight-dim">(empty response)</span>');
                return;
            }

            const ctype = (result.headers && result.headers['content-type']) || '';
            const looksHtml = /text\/html/i.test(ctype) || /^\s*<(!doctype|html)\b/i.test(body);

            // A page of markup dumped into a terminal is noise. Real curl does
            // print it, and `-i` still shows the headers, but the useful default
            // here is a summary: this shell exists to read APIs.
            if (looksHtml) {
                // Capped by characters, not lines: this site's HTML is minified
                // onto a single line, so a line-based preview would still be
                // the whole document.
                const HTML_PREVIEW = 280;
                const title = (/<title[^>]*>([^<]*)<\/title>/i.exec(body) || [])[1];
                const kb = (body.length / 1024).toFixed(1);
                if (title) {
                    await typeRaw(`<span class="highlight-name">${escapeHtml(title.trim())}</span>`);
                }
                await typeRaw(
                    `<span class="highlight-dim">${escapeHtml(ctype.split(';')[0] || 'text/html')} ` +
                    `&middot; ${kb}KB${result.truncated ? '+ (truncated upstream)' : ''} ` +
                    `&middot; ${body.length.toLocaleString()} characters</span>`
                );
                const snippet = body.slice(0, HTML_PREVIEW);
                await typeRaw(
                    `<div style="white-space:pre-wrap">${escapeHtml(snippet)}` +
                    `${body.length > HTML_PREVIEW ? '<span class="highlight-dim">…</span>' : ''}</div>`
                );
                if (body.length > HTML_PREVIEW) {
                    await typeRaw(
                        '<span class="highlight-dim">[HTML is summarised rather than dumped. ' +
                        'Use -i for the headers, or open the page in a browser.]</span>'
                    );
                }
                return;
            }

            // Pretty-print JSON; leave any other text exactly as it arrived.
            try { body = JSON.stringify(JSON.parse(body), null, 2); } catch (e) { /* not JSON */ }

            const overLong = body.length > CURL_MAX_DISPLAY;
            if (overLong) body = body.slice(0, CURL_MAX_DISPLAY);
            // Escaped without exception: this lands in innerHTML.
            await typeRaw(`<div style="white-space:pre-wrap">${escapeHtml(body)}</div>`);
            if (overLong || result.truncated) {
                await typeRaw(`<span class="highlight-dim">[truncated${result.truncated ? ' upstream' : ''} at ${overLong ? CURL_MAX_DISPLAY + ' chars' : '64KB'}]</span>`);
            }
        }

        // --- shuffle bag ---------------------------------------------------
        // Random order, no repeat until the pool is exhausted. Same idea the
        // UFO leader and the peek-a-boo alien already use.
        function bagPick(pool, bag) {
            if (!bag.length) {
                const order = pool.map((_, i) => i);
                for (let i = order.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [order[i], order[j]] = [order[j], order[i]];
                }
                bag.push(...order);
            }
            return pool[bag.pop()];
        }

        // Exactly one file here is genuinely transferable, so that one really
        // does arrive. Everything else gets talked out of it.
        const SCP_KNOWN = {

            'definitely_not_malware.sh': "I am not transferring a file called 'definitely_not_malware.sh'. I have standards.",
            'lofi_beats_to_debug_to.mp3': 'That playlist is load-bearing. It stays where it is.',

        // scp-style transfer line that updates in place.
        function scpProgress(name, kb) {
            return new Promise((resolve) => {
                const row = document.createElement('div');
                row.className = 'output';
                outputContainer.appendChild(row);
                const steps = 16;
                const started = Date.now();
                let i = 0;
                const tick = () => {
                    const pct = Math.round((i / steps) * 100);
                    const sent = Math.round((kb * i) / steps);
                    const elapsed = Math.max(0.2, (Date.now() - started) / 1000);
                    const rate = (sent / 1024 / elapsed).toFixed(1);
                    row.innerHTML =
                        `<span class="highlight-name">${escapeHtml(name)}</span>  ` +
                        `<span class="highlight-value">${String(pct).padStart(3)}%</span>  ` +
                        `${String(sent).padStart(5)}KB  ${String(rate).padStart(4)}MB/s  ` +
                        `00:${String(Math.round(elapsed)).padStart(2, '0')}`;
                    terminal.scrollTop = terminal.scrollHeight;
                    if (i++ < steps) window.setTimeout(tick, 55);
                    else resolve();
                };
                tick();
            });
        }

        // A Drive /view link opens the viewer. The download endpoint sends
        // Content-Disposition: attachment, so the browser saves the file and
        // never leaves the page. Returns null if the link is not a Drive file,
        // in which case the caller falls back to opening a tab.
        function driveDownloadUrl(url) {
            const m = /\/file\/d\/([A-Za-z0-9_-]+)/.exec(url || '');
            return m ? `https://drive.usercontent.google.com/download?id=${m[1]}&export=download` : null;

        // origin.
        function triggerDownload(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.rel = 'noopener';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            window.setTimeout(() => a.remove(), 1000);

        const OPEN_SECTIONS = {

                    "font-family:'Roboto Mono',monospace;padding:18px;gap:10px;";

                const bar = document.createElement('div');
                bar.style.cssText =
                    "display:flex;align-items:center;gap:12px;color:" + primary + ";font-size:12px;flex-wrap:wrap;";

                const title = document.createElement('span');
                title.style.cssText = "flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;";
                title.textContent = label;

                const mkBtn = (text) => {
                    const b = document.createElement('button');
                    b.textContent = text;
                    b.style.cssText =
                        "font-family:inherit;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;" +
                        "background:transparent;color:" + accent + ";border:1px solid " + accent +
                        ";border-radius:5px;padding:4px 10px;cursor:pointer;";
                    return b;
                };
                const tabBtn = mkBtn('open in tab');
                const closeBtn = mkBtn('esc');

                const frame = document.createElement('iframe');
                frame.src = url;
                // No allow-top-navigation: a framed page must not be able to
                // steer the terminal somewhere else.
                frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
                if (!sameOrigin) frame.setAttribute('referrerpolicy', 'no-referrer');
                frame.style.cssText =
                    "flex:1;width:100%;border:1px solid " + primary + ";border-radius:8px;background:#000;" +
                    "box-shadow:0 0 22px " + primary + "44;";

                const note = document.createElement('div');
                note.style.cssText = "color:#888;font-size:11px;min-height:14px;";
                note.textContent = sameOrigin ? '' : 'Framing a third-party site. Many refuse.';

                bar.appendChild(title);
                bar.appendChild(tabBtn);
                bar.appendChild(closeBtn);
                overlay.appendChild(bar);
                overlay.appendChild(frame);
                overlay.appendChild(note);
                document.body.appendChild(overlay);

                // Not detection, just an honest nudge on a timer.
                let hintTimer = 0;
                if (!sameOrigin) {
                    hintTimer = window.setTimeout(() => {
                        note.innerHTML = 'Blank, or "refused to connect"? That site sends X-Frame-Options. Use <b style="color:' + accent + '">open in tab</b>.';
                    }, 2500);
                }

                function cleanup() {
                    window.clearTimeout(hintTimer);
                    document.removeEventListener('keydown', onKey, true);
                    overlay.remove();
                    resolve();
                }
                function onKey(e) {
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        e.stopPropagation();
                        cleanup();
                    }
                }
                tabBtn.addEventListener('click', () => {
                    window.open(url, '_blank', 'noopener');
                });
                closeBtn.addEventListener('click', cleanup);
                document.addEventListener('keydown', onKey, true);

                if (typeof SoundFX !== 'undefined') SoundFX.dataBurst();

        async function runOpen(argline) {
            const target = (argline || '').trim();
            if (!target) {
                SoundFX.error();
                await typeRaw('<span class="error-text">open: what should I open?</span>');
                await typeRaw('Usage: open &lt;section|path|url&gt;');
                await typeRaw('Sections: ' + Object.keys(OPEN_SECTIONS).sort()
                    .map((k) => `<span class="nav-link" onclick="runCommandFromClick('open ${k}')">${k}</span>`).join('  '));
                // Most large sites send X-Frame-Options and simply refuse. These
                // were checked and do not, so the first attempt is not a coin flip.
                await typeRaw(
                    '<span class="highlight-dim">Most big sites refuse to be framed (google, github, mdn). These do not:</span> ' +
                    ['info.cern.ch', 'en.wikipedia.org', 'news.ycombinator.com', 'xkcd.com']
                        .map((h) => `<span class="nav-link" onclick="runCommandFromClick('open ${h}')">${h}</span>`).join('  ')
                );
                return;
            }

            const shorthand = OPEN_SECTIONS[target.toLowerCase()];
            let resolved;
            if (shorthand) {
                // ?embed=1 tells the portfolio to skip its enter screen, which
                // an iframe would otherwise inherit from this tab's session.
                const [path, hash] = shorthand.split('#');
                resolved = new URL(`${path}${path.includes('?') ? '&' : '?'}embed=1${hash ? '#' + hash : ''}`, window.location.origin);
            } else {
                // A bare hostname resolves as a relative path against this
                // origin, so `open example.com` would have framed
                // miitdaga.dev/example.com. Anything that looks like a host and
                // is not a local filename gets https:// put in front of it.
                let raw = target;
                const firstSeg = raw.split(/[/?#]/)[0];
                const hasScheme = /^[a-z][a-z0-9+.-]*:/i.test(raw);
                const isFile = /\.(html?|css|js|json|txt|xml|pdf|png|jpe?g|svg|ico|webmanifest)$/i.test(firstSeg);
                const isHostish = /^[^\s]+\.[a-z]{2,}$/i.test(firstSeg);
                if (!hasScheme && !raw.startsWith('/') && !raw.startsWith('#') && isHostish && !isFile) {
                    raw = 'https://' + raw;
                }
                try { resolved = new URL(raw, window.location.origin); }
                catch (e) {
                    SoundFX.error();
                    await typeRaw(`<span class="error-text">open: could not resolve '${escapeHtml(target.slice(0, 60))}'</span>`);
                    return;
                }
            }

            if (resolved.protocol !== 'http:' && resolved.protocol !== 'https:') {
                SoundFX.error();
                await typeRaw(`<span class="error-text">open: only http and https can be opened</span>`);
                return;
            }

            // An http frame inside an https page is mixed content, which the
            // browser blocks outright and silently: a blank frame with nothing
            // in the console. Upgrade rather than hand over a mystery.
            let upgraded = false;
            if (resolved.protocol === 'http:' && window.location.protocol === 'https:') {
                resolved.protocol = 'https:';
                upgraded = true;
            }

            const sameOrigin = resolved.origin === window.location.origin;
            SoundFX.enter();
            if (upgraded) {
                await typeRaw('<span class="highlight-dim">Upgraded to https: an http frame inside an https page is blocked as mixed content.</span>');
            }
            await typeLine(`Opening ${resolved.host}${resolved.pathname}${resolved.hash}...`, 8);
            if (!sameOrigin) {
                await typeRaw('<span class="highlight-dim">Third-party sites usually refuse to be framed. There is a tab button if it comes up blank.</span>');
            }
            await openFrame(resolved.toString(), shorthand ? `portfolio ${target.toLowerCase()}` : resolved.host + resolved.pathname, sameOrigin);
            await typeRaw('<span class="highlight-dim">Frame closed.</span>');
        }

        async function showLeaderboard(arg) {

        }

        // Rows are built first so the "is this me" highlight can be applied
        // without an await inside the forEach.

                `<span class="highlight-value">${r.score}</span>` +

        const LB_TOP = [
            'First place. Whoever held that is going to notice.',
            'Top of the board. Someone is about to lose an evening taking it back.',
            'Number one. Records are rented, not owned, but enjoy the lease.',
            'You are the benchmark now. Sorry about the pressure.',
        ];
        const LB_PODIUM = [
            'Podium. Close enough to first to be annoyed about it.',
            'Top three. Respectable, and irritatingly close.',
            'On the podium. One good run from the top.',
            'Nearly. That is the worst kind of good.',
        ];
        const LB_BOARD = [
            'On the board. Not on the podium, but on the board.',
            'Mid-table, which is the most honest place to be.',
            'You made the list. History will file you under "and others".',
            'Solidly average, which takes more effort than it sounds.',
        ];
        const LB_MISSED = [

            'Ten people are better than you at a game inside a fake terminal. Sit with that.',
            'Close, in roughly the way Earth is close to Mars.',
            'The leaderboard has read your submission and declined to comment.',
            'Filed. Not displayed, but filed.',
        ];
        const lbTopBag = [], lbPodiumBag = [], lbBoardBag = [], lbMissedBag = [];

        function lbReaction(rank) {
            if (rank === 1) return bagPick(LB_TOP, lbTopBag);
            if (rank === 2 || rank === 3) return bagPick(LB_PODIUM, lbPodiumBag);
            if (rank >= 4) return bagPick(LB_BOARD, lbBoardBag);

        async function postScore(game, name, score) {
            try {
                const res = await fetch('/api/leaderboard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ game, name, score }),
                });
                return { res, data: await res.json() };
            } catch (e) {
                return { res: null, data: null };
            }
        }

        async function renderBoard(rows) {

                lbRow(medal, r, r.name.toLowerCase() === termUser.toLowerCase());

        // Offered once a game ends. Declining costs one keypress and nothing is
        // sent; the score stays local either way.
        async function offerLeaderboard(game) {
            if (!LB_GAMES[game]) return;
            const score = lbLocalBest(game);
            if (!score) return;

            const named = termUser !== DEFAULT_USER;
            const label = named
                ? `Post ${score} to the leaderboard? Enter for ${escapeHtml(termUser)}, a name to use another, Esc to skip`
                : `Post ${score} to the leaderboard? Type a name, or Enter to skip`;
            const answer = await promptFor(label);
            if (answer === null) {
                await typeRaw('<span class="highlight-dim">Skipped. The score is still yours locally.</span>');
                return;
            }
            let name = (answer || '').trim();
            if (!name && named) name = termUser;
            if (!name) {
                await typeRaw('<span class="highlight-dim">Skipped. The score is still yours locally.</span>');
                return;
            }

            await typeSpinner(`Posting ${LB_GAMES[game]} ${score}`, 500);

                await typeRaw('<span class="error-text">Could not reach the leaderboard. Score kept locally.</span>');

            SoundFX.successChime();
            await typeLine(data.rank ? `Posted. Rank ${data.rank}.` : 'Posted.', 10);
            await typeLine(lbReaction(data.rank || 0), 12);
